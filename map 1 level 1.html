<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Level 1 - Fractions & Decimals Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .title {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      to {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
    }

    .tutorial-section {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .animation-container {
      position: relative;
      height: 400px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      margin: 20px 0;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .fraction-visual {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
    }

    .fraction-visual:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
    }

    .fraction-1-2 {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      top: 50px;
      left: 100px;
    }

    .fraction-1-4 {
      background: linear-gradient(45deg, #4ecdc4, #44a08d);
      top: 100px;
      left: 250px;
    }

    .fraction-3-4 {
      background: linear-gradient(45deg, #45b7d1, #3498db);
      top: 80px;
      left: 400px;
    }

    .fraction-1-5 {
      background: linear-gradient(45deg, #f9ca24, #f39c12);
      top: 200px;
      left: 150px;
    }

    .fraction-2-5 {
      background: linear-gradient(45deg, #f0932b, #eb6f47);
      top: 250px;
      left: 350px;
    }

    .decimal-display {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      padding: 15px 25px;
      border-radius: 25px;
      font-size: 24px;
      font-weight: bold;
      opacity: 0;
      transition: all 0.5s ease;
    }

    .controls {
      text-align: center;
      margin: 20px 0;
    }

    .control-btn {
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 0 10px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-weight: bold;
    }

    .audio-status {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      font-size: 12px;
    }

    .speaking-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #4CAF50;
      border-radius: 50%;
      margin-left: 10px;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .quiz-section {
      display: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px;
      margin-top: 30px;
    }

    .question {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }

    .option {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      font-weight: bold;
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .option.correct {
      background: linear-gradient(45deg, #27ae60, #2ecc71);
      border-color: #27ae60;
    }

    .option.wrong {
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      border-color: #e74c3c;
    }

    .feedback {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
    }

    .feedback.show {
      opacity: 1;
      transform: translateY(0);
    }

    .score-progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .progress-bar {
      flex-grow: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      margin: 0 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(45deg, #27ae60, #2ecc71);
      width: 0%;
      transition: width 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .bounce {
      animation: bounce 0.6s ease;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      50% {
        box-shadow: 0 4px 25px rgba(255, 255, 255, 0.6);
      }
    }

    .glow {
      animation: glow 1s ease-in-out;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Level 1 Quiz</h1>
      <p>Interactive Learning with Voice Guidance</p>
    </div>

    <button class="audio-btn" onclick="toggleAudio()">🔊 Audio On</button>
    <div class="audio-status" id="audio-status">🎵 Audio Ready</div>

    <div class="tutorial-section">
      <h2>Demonstration</h2>
      <p>Click the "Start Quiz" button below to begin Level 1.</p>

      <div class="animation-container" id="animationContainer">
        <div class="fraction-visual fraction-1-2" data-fraction="1/2" data-decimal="0.5">1/2</div>
        <div class="fraction-visual fraction-1-4" data-fraction="1/4" data-decimal="0.25">1/4</div>
        <div class="fraction-visual fraction-3-4" data-fraction="3/4" data-decimal="0.75">3/4</div>
        <div class="fraction-visual fraction-1-5" data-fraction="1/5" data-decimal="0.2">1/5</div>
        <div class="fraction-visual fraction-2-5" data-fraction="2/5" data-decimal="0.4">2/5</div>

        <div class="decimal-display" id="decimalDisplay">Click a fraction to see its decimal!</div>
      </div>

      <div class="controls">
        <button class="control-btn" onclick="startAnimation()">🎬 Show Animation</button>
        <button class="control-btn" onclick="startQuiz()">📝 Start Quiz</button>
        <button class="control-btn" onclick="window.location.href='map 1.html'">🗺️ Back to Map</button>
      </div>
    </div>

    <div class="quiz-section" id="quizSection">
      <div class="score-progress">
        <span id="scoreDisplay">Score: 0/5</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressText">Question 1 of 5</span>
      </div>

      <div class="question" id="questionText">Ready for your first question?</div>
      <div class="options-container" id="optionsContainer"></div>
      <div class="feedback" id="feedback"></div>

      <div style="text-align: center; margin-top: 20px;">
        <button class="control-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">Next Question
          →</button>
      </div>
    </div>
  </div>

  <script>
    // Variables
    let currentSpeech = null;
    let speechQueue = [];
    let isProcessingQueue = false;
    let audioEnabled = true;
    let isPlaying = false;
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let totalQuestions = 5;

    const allQuestions = [
      // Your 12 questions remain here...
      { question: "What is 1/2 expressed as a decimal?", options: ["0.25", "0.5", "0.75", "1.0"], correct: 1, explanation: "One half means one divided by two, which equals zero point five." },
      { question: "Which of the following is equivalent to 3/4?", options: ["0.25", "0.5", "0.75", "1.0"], correct: 2, explanation: "Three fourths equals three divided by four, which gives us zero point seven five." },
      { question: "Convert 0.2 into a fraction:", options: ["1/2", "1/5", "2/5", "1/10"], correct: 1, explanation: "Zero point two can be written as two by ten, which simplifies to one by five." },
      { question: "Which is the largest value?", options: ["0.3", "1/4", "0.25", "2/5"], correct: 3, explanation: "Two by five equals zero point four, which is the largest value." },
      { question: "What is 3/5 as a decimal?", options: ["0.35", "0.6", "0.53", "0.65"], correct: 1, explanation: "Three divided by five, which equals zero point six." },
      { question: "Convert 0.75 to a fraction in simplest form:", options: ["3/4", "7/5", "75/100", "15/20"], correct: 0, explanation: "Zero point seven five equals seventy five by one hundred, which simplifies to three by four." },
      { question: "What is 7/8 as a decimal?", options: ["0.875", "0.78", "0.87", "0.775"], correct: 0, explanation: "Seven divided by eight equals zero point eight seven five." },
      { question: "Which fraction equals 0.4?", options: ["1/4", "2/5", "3/7", "4/9"], correct: 1, explanation: "Two by five equals zero point four." },
      { question: "What is 5/6 as a decimal (rounded to 2 places)?", options: ["0.83", "0.86", "0.85", "0.82"], correct: 0, explanation: "Five divided by six equals approximately zero point eight three." },
      { question: "Convert 0.125 to a fraction:", options: ["1/8", "1/4", "1/6", "1/12"], correct: 0, explanation: "Zero point one two five simplifies to one by eight." },
      { question: "Which is equivalent to 60%?", options: ["0.6", "3/5", "6/10", "All of these"], correct: 3, explanation: "Sixty percent equals zero point six, three by five, and six by ten. All are correct!" },
      { question: "What is 9/10 as a decimal?", options: ["0.9", "0.09", "9.0", "0.19"], correct: 0, explanation: "Nine by ten equals zero point nine." }
    ];

    // All other JS functions (speak, startQuiz, etc.) remain the same...

    function selectRandomQuestions() {
      const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
      quizQuestions = shuffled.slice(0, 5);
    }

    function addNaturalPauses(text) {
      return text.replace(/\./g, '. ').replace(/,/g, ', ').replace(/!/g, '! ').replace(/\?/g, '? ').replace(/:/g, ': ');
    }

    function speak(text, callback, pauseBefore = 0) {
      if (!audioEnabled) { if (callback) callback(); return Promise.resolve(); }
      return new Promise((resolve) => {
        speechQueue.push({ text: addNaturalPauses(text), callback, pauseBefore, resolve });
        if (!isProcessingQueue) { processNextSpeech(); }
      });
    }

    function processNextSpeech() {
      if (speechQueue.length === 0) { isProcessingQueue = false; return; }
      isProcessingQueue = true;
      const speechItem = speechQueue.shift();
      setTimeout(() => {
        speakDirectly(speechItem.text, () => {
          if (speechItem.callback) speechItem.callback();
          speechItem.resolve();
          processNextSpeech();
        });
      }, speechItem.pauseBefore);
    }

    function speakDirectly(text, callback) {
      if (!audioEnabled) { if (callback) callback(); return; }
      if (currentSpeech) { speechSynthesis.cancel(); }
      currentSpeech = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      let selectedVoice = voices.find(voice => voice.lang === "hi-IN") || voices.find(voice => voice.name.toLowerCase().includes("india")) || voices.find(voice => voice.lang.startsWith("en"));
      if (selectedVoice) { currentSpeech.voice = selectedVoice; }
      currentSpeech.lang = "en-IN"; currentSpeech.rate = 1.1; currentSpeech.pitch = 1.15; currentSpeech.volume = 0.9;
      currentSpeech.onstart = () => { document.getElementById("audio-status").innerHTML = `🔊 Speaking...<span class="speaking-indicator"></span>`; isPlaying = true; };
      currentSpeech.onend = () => { document.getElementById("audio-status").innerText = "✅ Audio finished"; currentSpeech = null; isPlaying = false; if (callback) callback(); };
      currentSpeech.onerror = () => { document.getElementById("audio-status").innerText = "❌ Audio error"; currentSpeech = null; isPlaying = false; if (callback) callback(); };
      speechSynthesis.speak(currentSpeech);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.querySelector('.audio-btn');
      if (audioEnabled) { btn.textContent = '🔊 Audio On'; document.getElementById("audio-status").innerText = "🎵 Audio Ready"; }
      else { btn.textContent = '🔇 Audio Off'; document.getElementById("audio-status").innerText = "🔇 Audio Disabled"; if (currentSpeech) { speechSynthesis.cancel(); } speechQueue = []; isProcessingQueue = false; }
    }

    function decimalToWords(decimalStr) {
      const words = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
      const parts = decimalStr.split('.');
      let result = '';
      // Integer part
      result += parts[0].split('').map(d => words[parseInt(d, 10)]).join(' ');
      // Decimal part
      if (parts[1]) {
        result += ' point ';
        result += parts[1].split('').map(d => words[parseInt(d, 10)]).join(' ');
      }
      return result;
    }
    async function startAnimation() {
      await speak("Welcome to our interactive math tutorial! Let's explore the wonderful world of fractions and decimals together. I'll guide you through each step with gentle explanations and encouraging words.");

      const fractions = document.querySelectorAll('.fraction-visual');

      for (let i = 0; i < fractions.length; i++) {
        setTimeout(() => {
          fractions[i].style.opacity = '1';
          fractions[i].classList.add('bounce');
        }, i * 800);
      }

      await speak("You can see colorful circles representing different fractions. Each fraction tells us about parts of a whole. Click on any fraction circle to discover its decimal equivalent!");
    }

    // Fraction interaction
document.querySelectorAll('.fraction-visual').forEach(fraction => {
  fraction.addEventListener('click', async () => {
    const fractionText = fraction.dataset.fraction;
    const decimalValue = fraction.dataset.decimal;

    fraction.classList.add('glow');
    setTimeout(() => fraction.classList.remove('glow'), 1000);

    const decimalDisplay = document.getElementById('decimalDisplay');
    decimalDisplay.textContent = `${fractionText} = ${decimalValue}`;
    decimalDisplay.style.opacity = '1';

    // Use decimalToWords for speech
    const decimalWords = decimalToWords(decimalValue);
    await speak(`${fractionText} equals ${decimalWords} as a decimal. Isn't that beautiful how fractions and decimals represent the same value in different ways?`);

    setTimeout(() => {
      decimalDisplay.style.opacity = '0';
    }, 4000);
  });
});

    async function startQuiz() {
      document.getElementById('quizSection').style.display = 'block';
      document.getElementById('quizSection').scrollIntoView({ behavior: 'smooth' });
      selectRandomQuestions();
      currentQuestionIndex = 0; score = 0;
      updateScore(); updateProgress();
      await speak("Wonderful! Let's begin the Level 1 quiz. Do your best!");
      setTimeout(() => { showQuestion(); }, 1500);
    }

    async function showQuestion() {
      const question = quizQuestions[currentQuestionIndex];
      document.getElementById('questionText').textContent = question.question;
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      question.options.forEach((option, index) => {
        const optionElement = document.createElement('div');
        optionElement.className = 'option fade-in';
        optionElement.textContent = option;
        optionElement.onclick = () => selectOption(index);
        optionElement.style.animationDelay = (index * 0.1) + 's';
        optionsContainer.appendChild(optionElement);
      });
      document.getElementById('feedback').classList.remove('show');
      document.getElementById('nextBtn').style.display = 'none';
      await speak(question.question);
    }

    async function selectOption(selectedIndex) {
      const question = quizQuestions[currentQuestionIndex];
      const options = document.querySelectorAll('.option');
      const feedback = document.getElementById('feedback');
      options.forEach(option => option.onclick = null);
      if (selectedIndex === question.correct) {
        options[selectedIndex].classList.add('correct');
        feedback.className = 'feedback show correct';
        feedback.innerHTML = '<h3>🎉 Excellent!</h3><p>' + question.explanation + '</p>';
        score++; updateScore();
        await speak(`Excellent work! ${question.explanation}`);
      } else {
        options[selectedIndex].classList.add('wrong');
        options[question.correct].classList.add('correct');
        feedback.className = 'feedback show wrong';
        feedback.innerHTML = '<h3>💡 Learning Opportunity</h3><p>' + question.explanation + '</p>';
        await speak(`Not quite. ${question.explanation}`);
      }
      document.getElementById('nextBtn').style.display = 'inline-block';
      updateProgress();
    }

    async function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < totalQuestions) { setTimeout(() => { showQuestion(); }, 500); }
      else { await showFinalResults(); }
    }

    async function showFinalResults() {
      const percentage = Math.round((score / totalQuestions) * 100);
      let message, voiceMessage;
      if (score >= 3) {
        message = `🎉 Outstanding! You scored ${score}/${totalQuestions} (${percentage}%)`;
        voiceMessage = `Outstanding performance! You scored ${score} out of ${totalQuestions}. You have completed this level beautifully!`;
      } else {
        message = `🌱 Good effort! You scored ${score}/${totalQuestions} (${percentage}%)`;
        voiceMessage = `You scored ${score} out of ${totalQuestions}. That's a good start! Try again to unlock the next level.`;
      }

      let actionButton;
      if (score >= 3) {
        actionButton = `<button class="control-btn" onclick="goToNextLevel()" style="margin-top: 20px;">🚀 Next Level →</button>`;
      } else {
        actionButton = `<button class="control-btn" onclick="startQuiz()" style="margin-top: 20px;">🔄 Try Again</button>`;
      }

      document.getElementById('questionText').textContent = 'Quiz Complete!';
      document.getElementById('optionsContainer').innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 20px;"><h2>${message}</h2>${actionButton}</div>`;
      document.getElementById('feedback').classList.remove('show');
      document.getElementById('nextBtn').style.display = 'none';
      await speak(voiceMessage);
    }

    function updateScore() { document.getElementById('scoreDisplay').textContent = `Score: ${score}/${totalQuestions}`; }
    function updateProgress() {
      const progress = ((currentQuestionIndex + 1) / totalQuestions) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
    }

    // --- MODIFIED FUNCTION ---
    // This function now updates and saves the game's progress before going back to the map.
    async function goToNextLevel() {
      await speak("Excellent work! Taking you back to the map to unlock the next level.");

      const progressKey = 'myMathGameProgress';
      const currentLevelId = 1; // This page is for level 1
      const nextLevelId = 2;    // The next level is 2

      // Get the current progress from localStorage
      let progressData = JSON.parse(localStorage.getItem(progressKey));

      if (progressData) {
        // Find the index of the current level (level 1)
        const currentLevelIndex = progressData.findIndex(level => level.id === currentLevelId);
        if (currentLevelIndex !== -1) {
          // Update the current level to 'completed' and award 3 stars
          progressData[currentLevelIndex].status = 'completed';
          progressData[currentLevelIndex].stars = 3;
        }

        // Find the index of the next level (level 2)
        const nextLevelIndex = progressData.findIndex(level => level.id === nextLevelId);
        if (nextLevelIndex !== -1) {
          // Update the next level to 'unlocked'
          progressData[nextLevelIndex].status = 'unlocked';
        }

        // Save the modified progress back to localStorage
        localStorage.setItem(progressKey, JSON.stringify(progressData));
      }

      // Redirect back to the map page
      window.location.href = "map 1.html";
    }


    document.addEventListener('DOMContentLoaded', () => {
      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.addEventListener('voiceschanged', () => console.log('Voices loaded.'));
      }
      setTimeout(() => {
        speak("Welcome to Level 1. Click Start Quiz to begin!");
      }, 1000);
    });
  </script>

</body>

</html>
